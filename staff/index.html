<!DOCTYPE HTML>
<!--

	html5up.net | @ajlkn | CCA 3.0 license

<html>
	<head>
		<title>Staff Dashboard — Dental Clinic</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="../assets/css/main.css" />
		<link rel="stylesheet" href="../assets/css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="../css/app.css" />
		<link rel="stylesheet" href="../css/mui-portal.css" />
	</head>
	<body class="is-preload staff-dashboard staff-shell">
		<div id="page-wrapper" class="dashboard-shell">

			<!-- Permanent left Drawer (MUI CRUD dashboard pattern) -->
			<aside id="staff-drawer" class="dashboard-drawer" aria-label="Staff navigation">
				<div class="drawer-brand">
					<a href="../index.html" id="logo" class="drawer-logo">Bright Smile <em>Dental Clinic</em></a>
				</div>

				<nav class="drawer-nav" aria-label="Staff sections">
					<ul class="drawer-list">
						<li>
							<button type="button" class="drawer-item active" aria-current="page">
								<span class="drawer-item-icon" aria-hidden="true"><i class="fas fa-users"></i></span>
								<span class="drawer-item-text">Patients</span>
							</button>
						</li>
					</ul>
				</nav>

				<div class="drawer-footer">
					<button type="button" class="drawer-item drawer-logout" id="logout-btn" data-testid="logout-btn">
						<span class="drawer-item-icon" aria-hidden="true"><i class="fas fa-sign-out-alt"></i></span>
						<span class="drawer-item-text">Logout</span>
					</button>
				</div>
			</aside>

			<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>

			<div class="dashboard-main">
				<header class="dashboard-appbar" role="banner">
					<button type="button" class="drawer-toggle" id="drawer-toggle" aria-label="Open navigation menu" aria-controls="staff-drawer" aria-expanded="false">
						<i class="fas fa-bars" aria-hidden="true"></i>
					</button>
					<div class="appbar-titles">
						<h1 class="appbar-page-title" id="page-section-title">Patients</h1>
						<p class="appbar-meta">
							<span id="user-greeting" data-testid="user-greeting"></span>
							<span id="user-role" class="badge"></span>
						</p>
					</div>
				</header>

				<main class="dashboard-content" id="content">
					<article class="mui-paper dashboard-paper">
						<div id="staff-alert" class="alert" hidden data-testid="staff-alert"></div>

						<div class="panel">
							<div class="toolbar">
								<ul class="actions">
									<li><button type="button" class="button primary" id="add-patient-btn" data-testid="add-patient">+ Patient</button></li>
								</ul>
							</div>

							<form id="patient-search-form" class="search-form" data-testid="patient-search" action="#" method="get">
								<div class="search-fields">
									<div>
										<label for="search-name">Search by name</label>
										<input type="text" id="search-name" class="search-input" data-testid="search-name" placeholder="First or last name" />
									</div>
									<div>
										<label for="search-dob">Date of birth</label>
										<input type="text" id="search-dob" class="search-input" data-testid="search-dob" placeholder="dd/mm/yyyy" inputmode="numeric" />
									</div>
									<ul class="actions">
										<li><button type="submit" class="button" data-testid="search-patients">Search</button></li>
										<li><button type="button" class="button" id="clear-search-btn" data-testid="clear-search">Clear</button></li>
									</ul>
								</div>
							</form>

							<div class="table-wrapper">
								<table class="patient-table" id="patient-table" data-testid="patient-table">
									<thead>
										<tr>
											<th class="col-name">Name</th>
											<th class="col-dob">Date of Birth</th>
											<th class="col-phone">Phone</th>
											<th class="col-email">Email</th>
											<th class="col-actions" aria-label="Actions"></th>
										</tr>
									</thead>
									<tbody></tbody>
								</table>
							</div>

							<div class="pagination-bar" id="patient-pagination" data-testid="patient-pagination">
								<div class="pagination-controls">
									<button type="button" class="pagination-arrow" id="first-page" data-testid="first-page" aria-label="First page" data-tooltip="First" disabled>
										<i class="fas fa-angle-double-left" aria-hidden="true"></i>
									</button>
									<button type="button" class="pagination-arrow" id="prev-page" data-testid="prev-page" aria-label="Previous page" data-tooltip="Previous" disabled>
										<i class="fas fa-chevron-left" aria-hidden="true"></i>
									</button>
								</div>
								<span id="page-info" data-testid="page-info"></span>
								<div class="pagination-controls">
									<button type="button" class="pagination-arrow" id="next-page" data-testid="next-page" aria-label="Next page" data-tooltip="Next" disabled>
										<i class="fas fa-chevron-right" aria-hidden="true"></i>
									</button>
									<button type="button" class="pagination-arrow" id="last-page" data-testid="last-page" aria-label="Last page" data-tooltip="Last" disabled>
										<i class="fas fa-angle-double-right" aria-hidden="true"></i>
									</button>
								</div>
							</div>
						</div>
					</article>
				</main>
			</div>

		</div>

		<div id="toast-container" class="toast-container" data-testid="toast-container"></div>

		<div id="view-patient-overlay" class="modal-overlay" hidden aria-hidden="true" data-testid="view-patient-overlay">
			<div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="view-patient-title">
				<button type="button" class="modal-close" id="close-view-patient-overlay" aria-label="Close" data-testid="close-view-patient-overlay">&times;</button>
				<div class="modal-header">
					<div class="modal-header-row">
						<h3 id="view-patient-title">Patient Details</h3>
						<div class="modal-header-actions">
							<button type="submit" form="view-patient-form" class="button primary" id="save-patient-btn" data-testid="save-patient" hidden>Save</button>
							<button type="button" class="button" id="edit-patient-btn" data-testid="edit-patient-btn">Edit</button>
						</div>
					</div>
				</div>
				<div class="modal-body">
					<form id="view-patient-form" class="form-grid" data-testid="patient-readonly-view">
						<label>First Name</label>
						<input type="text" name="first_name" required disabled data-testid="patient-first-name" />
						<label>Last Name</label>
						<input type="text" name="last_name" required disabled data-testid="patient-last-name" />
						<label>Date of Birth</label>
						<input type="date" name="date_of_birth" disabled data-testid="patient-dob" />
						<label>Email</label>
						<input type="email" name="email" disabled data-testid="patient-email" />
						<label>Phone</label>
						<input type="text" name="phone" disabled data-testid="patient-phone" />
						<label>Address</label>
						<input type="text" name="address" disabled data-testid="patient-address" />
						<label>Emergency Contact Name</label>
						<input type="text" name="emergency_contact_name" disabled />
						<label>Emergency Contact Phone</label>
						<input type="text" name="emergency_contact_phone" disabled />
						<label>Notes</label>
						<textarea name="notes" rows="3" disabled></textarea>
					</form>
					<div id="visit-history-section">
						<h4 class="modal-section-title">Visit History</h4>
						<ul id="history-list" class="history-list" data-testid="history-list"></ul>
					</div>
				</div>
			</div>
		</div>

		<div id="add-visit-overlay" class="modal-overlay" hidden aria-hidden="true" data-testid="add-visit-overlay">
			<div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="add-visit-title">
				<button type="button" class="modal-close" id="close-add-visit-overlay" aria-label="Close" data-testid="close-add-visit-overlay">&times;</button>
				<div class="modal-header">
					<h3 id="add-visit-title">Add Visit Record</h3>
					<p id="add-visit-patient-name" class="modal-subtitle"></p>
				</div>
				<div class="modal-body">
					<form id="history-form" class="form-grid" data-testid="history-form" novalidate>
						<div class="form-field" data-field="visit_date">
							<label for="history-date">Visit Date</label>
							<input type="date" id="history-date" name="visit_date" required data-testid="history-date" aria-describedby="history-date-error" />
							<p id="history-date-error" class="field-error" hidden data-testid="history-date-error"></p>
						</div>

						<div class="form-field" data-field="procedure_type">
							<label for="history-procedure">Procedure Type</label>
							<select id="history-procedure" name="procedure_type" required data-testid="history-procedure" aria-describedby="history-procedure-error">
								<option value="">Select a procedure</option>
								<option value="Checkup">Checkup</option>
								<option value="Cleaning">Cleaning</option>
								<option value="Filling">Filling</option>
								<option value="Extraction">Extraction</option>
								<option value="Root Canal">Root Canal</option>
								<option value="Crown">Crown</option>
								<option value="X-Ray">X-Ray</option>
								<option value="Other">Other</option>
							</select>
							<p id="history-procedure-error" class="field-error" hidden data-testid="history-procedure-error"></p>
						</div>

						<div class="form-field" data-field="description">
							<label for="history-description">Description</label>
							<input type="text" id="history-description" name="description" required data-testid="history-description" aria-describedby="history-description-error" />
							<p id="history-description-error" class="field-error" hidden data-testid="history-description-error"></p>
						</div>

						<div class="form-field" data-field="dentist_name">
							<label for="history-dentist">Dentist</label>
							<select id="history-dentist" name="dentist_name" required data-testid="history-dentist" aria-describedby="history-dentist-error">
								<option value="">Select a dentist</option>
							</select>
							<p id="history-dentist-error" class="field-error" hidden data-testid="history-dentist-error"></p>
						</div>

						<div class="form-field" data-field="history_notes">
							<label for="history-notes">Notes</label>
							<textarea id="history-notes" name="history_notes" rows="2" data-testid="history-notes"></textarea>
						</div>

						<ul class="actions special modal-actions">
							<li><button type="submit" class="button primary" data-testid="add-history">Add Visit</button></li>
							<li><button type="button" class="button" id="cancel-add-visit-btn" data-testid="cancel-add-visit-btn">Cancel</button></li>
						</ul>
					</form>
				</div>
			</div>
		</div>

		<div id="patient-form-overlay" class="modal-overlay" hidden aria-hidden="true" data-testid="patient-form-overlay">
			<div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="patient-form-title">
				<button type="button" class="modal-close" id="close-patient-overlay" aria-label="Close" data-testid="close-patient-overlay">&times;</button>
				<div class="modal-header">
					<h3 id="patient-form-title">Add Patient</h3>
				</div>
				<div class="modal-body">
					<form id="patient-form" class="form-grid" data-testid="patient-form">
						<label>First Name</label>
						<input type="text" name="first_name" required data-testid="patient-first-name" />
						<label>Last Name</label>
						<input type="text" name="last_name" required data-testid="patient-last-name" />
						<label>Date of Birth</label>
						<input type="date" name="date_of_birth" data-testid="patient-dob" />
						<label>Email</label>
						<input type="email" name="email" data-testid="patient-email" />
						<label>Phone</label>
						<input type="text" name="phone" data-testid="patient-phone" />
						<label>Address</label>
						<input type="text" name="address" data-testid="patient-address" />
						<label>Emergency Contact Name</label>
						<input type="text" name="emergency_contact_name" />
						<label>Emergency Contact Phone</label>
						<input type="text" name="emergency_contact_phone" />
						<label>Notes</label>
						<textarea name="notes" rows="3"></textarea>
						<ul class="actions special modal-actions">
							<li><button type="submit" class="button primary" data-testid="save-patient">Save</button></li>
							<li><button type="button" class="button" id="cancel-patient-btn">Cancel</button></li>
						</ul>
					</form>
				</div>
			</div>
		</div>

		<script src="../assets/js/jquery.min.js"></script>
		<script src="../assets/js/jquery.dropotron.min.js"></script>
		<script src="../assets/js/browser.min.js"></script>
		<script src="../assets/js/breakpoints.min.js"></script>
		<script src="../assets/js/util.js"></script>
		<script src="../assets/js/main.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
		<script src="../js/config.js"></script>
		<script src="../js/supabase-client.js"></script>
		<script src="../js/app.js"></script>
		<script src="../js/auth.js"></script>
		<script src="../js/patients.js"></script>
		<script src="../js/doctors.js"></script>
		<script src="../js/staff-dashboard.js"></script>
	</body>
</html>
