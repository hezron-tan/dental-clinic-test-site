<!DOCTYPE HTML>
<!--

	html5up.net | @ajlkn | CCA 3.0 license
-->
<html>
	<head>
		<title>Admin Dashboard — Dental Clinic</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="../assets/css/main.css" />
		<link rel="stylesheet" href="../assets/css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="../css/app.css" />
		<link rel="stylesheet" href="../css/mui-portal.css" />
	</head>
	<body class="is-preload admin-dashboard admin-shell">
		<div id="page-wrapper" class="dashboard-shell">

			<!-- Permanent left Drawer (MUI CRUD dashboard pattern) -->
			<aside id="admin-drawer" class="dashboard-drawer" aria-label="Admin navigation">
				<div class="drawer-brand">
					<a href="../index.html" id="logo" class="drawer-logo">Bright Smile <em>Dental Clinic</em></a>
				</div>

				<nav class="drawer-nav" data-testid="admin-tabs" aria-label="Admin sections">
					<ul class="drawer-list" role="tablist">
						<li>
							<button type="button" class="tab-btn drawer-item active" data-tab="clinic" role="tab" aria-selected="true" data-testid="tab-clinic">
								<span class="drawer-item-icon" aria-hidden="true"><i class="fas fa-hospital"></i></span>
								<span class="drawer-item-text">Clinic Information</span>
							</button>
						</li>
						<li>
							<button type="button" class="tab-btn drawer-item" data-tab="patients" role="tab" aria-selected="false" data-testid="tab-patients">
								<span class="drawer-item-icon" aria-hidden="true"><i class="fas fa-users"></i></span>
								<span class="drawer-item-text">Patients</span>
							</button>
						</li>
						<li>
							<button type="button" class="tab-btn drawer-item" data-tab="doctors" role="tab" aria-selected="false" data-testid="tab-doctors">
								<span class="drawer-item-icon" aria-hidden="true"><i class="fas fa-user-md"></i></span>
								<span class="drawer-item-text">Doctors</span>
							</button>
						</li>
					</ul>
				</nav>

				<div class="drawer-footer">
					<button type="button" class="drawer-item drawer-logout" id="logout-btn" data-testid="logout-btn">
						<span class="drawer-item-icon" aria-hidden="true"><i class="fas fa-sign-out-alt"></i></span>
						<span class="drawer-item-text">Logout</span>
					</button>
				</div>
			</aside>

			<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>

			<div class="dashboard-main">
				<header class="dashboard-appbar" role="banner">
					<button type="button" class="drawer-toggle" id="drawer-toggle" aria-label="Open navigation menu" aria-controls="admin-drawer" aria-expanded="false">
						<i class="fas fa-bars" aria-hidden="true"></i>
					</button>
					<div class="appbar-titles">
						<h1 class="appbar-page-title" id="page-section-title">Clinic Information</h1>
						<p class="appbar-meta">
							<span id="user-greeting" data-testid="user-greeting"></span>
							<span id="user-role" class="badge"></span>
						</p>
					</div>
				</header>

				<main class="dashboard-content" id="content">
					<article class="mui-paper dashboard-paper">
						<div id="storage-banner" class="alert alert-warning storage-banner" hidden></div>
						<div id="admin-alert" class="alert" hidden data-testid="admin-alert"></div>

						<div class="dashboard-tabs">
							<div class="tab-panel active" id="tab-clinic" role="tabpanel" data-testid="tab-panel-clinic">
								<div class="panel">
									<!-- MUI Container maxWidth="sm" + Paper pattern -->
									<div class="mui-container mui-container--sm">
										<div class="mui-form-paper">
											<p class="panel-intro">Changes appear on the public homepage immediately.</p>
											<form id="clinic-form" class="form-grid" data-testid="clinic-form">
												<label for="name">Clinic Name</label>
												<input type="text" id="name" name="name" required data-testid="clinic-name-input" />

												<label for="tagline">Tagline</label>
												<input type="text" id="tagline" name="tagline" data-testid="clinic-tagline-input" />

												<label for="address">Address</label>
												<input type="text" id="address" name="address" data-testid="clinic-address-input" />

												<div class="form-row form-row--2">
													<div class="form-field">
														<label for="phone">Phone</label>
														<input type="text" id="phone" name="phone" data-testid="clinic-phone-input" />
													</div>
													<div class="form-field">
														<label for="email">Email</label>
														<input type="email" id="email" name="email" data-testid="clinic-email-input" />
													</div>
												</div>

												<label for="hours">Office Hours</label>
												<input type="text" id="hours" name="hours" data-testid="clinic-hours-input" />

												<ul class="actions form-actions">
													<li><button type="submit" class="button primary" data-testid="save-clinic">Save Clinic Info</button></li>
												</ul>
											</form>
										</div>
									</div>
								</div>
							</div>

							<div class="tab-panel" id="tab-patients" role="tabpanel" hidden data-testid="tab-panel-patients">
								<div class="panel">
									<div class="toolbar">
										<ul class="actions">
											<li><button type="button" class="button primary" id="add-patient-btn" data-testid="add-patient">+ Patient</button></li>
										</ul>
									</div>

									<form id="patient-search-form" class="search-form" data-testid="patient-search">
										<div class="search-fields">
											<div>
												<label for="search-name">Search by name</label>
												<input type="text" id="search-name" class="search-input" data-testid="search-name" placeholder="First or last name" />
											</div>
											<ul class="actions">
												<li><button type="submit" class="button" data-testid="search-patients">Search</button></li>
												<li><button type="button" class="button" id="clear-search-btn" data-testid="clear-search">Clear</button></li>
											</ul>
										</div>
									</form>

									<div class="table-wrapper">
										<table class="patient-table" id="patient-table" data-testid="patient-table">
											<thead>
												<tr>
													<th class="col-name">Name</th>
													<th class="col-phone">Phone</th>
													<th class="col-email">Email</th>
													<th class="col-actions" aria-label="Actions"></th>
												</tr>
											</thead>
											<tbody></tbody>
										</table>
									</div>

									<div class="pagination-bar" id="patient-pagination" data-testid="patient-pagination">
										<div class="pagination-controls">
											<button type="button" class="pagination-arrow" id="first-page" data-testid="first-page" aria-label="First page" data-tooltip="First" disabled>
												<i class="fas fa-angle-double-left" aria-hidden="true"></i>
											</button>
											<button type="button" class="pagination-arrow" id="prev-page" data-testid="prev-page" aria-label="Previous page" data-tooltip="Previous" disabled>
												<i class="fas fa-chevron-left" aria-hidden="true"></i>
											</button>
										</div>
										<span id="page-info" data-testid="page-info"></span>
										<div class="pagination-controls">
											<button type="button" class="pagination-arrow" id="next-page" data-testid="next-page" aria-label="Next page" data-tooltip="Next" disabled>
												<i class="fas fa-chevron-right" aria-hidden="true"></i>
											</button>
											<button type="button" class="pagination-arrow" id="last-page" data-testid="last-page" aria-label="Last page" data-tooltip="Last" disabled>
												<i class="fas fa-angle-double-right" aria-hidden="true"></i>
											</button>
										</div>
									</div>
								</div>
							</div>

							<div class="tab-panel" id="tab-doctors" role="tabpanel" hidden data-testid="tab-panel-doctors">
								<div class="panel">
									<div class="toolbar">
										<ul class="actions">
											<li><button type="button" class="button primary" id="add-doctor-btn" data-testid="add-doctor">+ Doctor</button></li>
										</ul>
									</div>

									<div class="table-wrapper">
										<table class="doctor-table" id="doctor-table" data-testid="doctor-table">
											<thead>
												<tr>
													<th class="col-photo" aria-label="Photo"></th>
													<th class="col-name">Name</th>
													<th class="col-description">Description</th>
													<th class="col-actions" aria-label="Actions"></th>
												</tr>
											</thead>
											<tbody></tbody>
										</table>
									</div>
								</div>
							</div>
						</div>
					</article>
				</main>
			</div>

		</div>

		<div id="patient-form-overlay" class="modal-overlay" hidden aria-hidden="true" data-testid="patient-form-overlay">
			<div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="patient-form-title">
				<button type="button" class="modal-close" id="close-patient-overlay" aria-label="Close" data-testid="close-patient-overlay">&times;</button>
				<div class="modal-header">
					<h3 id="patient-form-title">Add Patient</h3>
				</div>
				<div class="modal-body">
					<form id="patient-form" class="form-grid" data-testid="patient-form">
						<label>First Name</label>
						<input type="text" name="first_name" required data-testid="patient-first-name" />
						<label>Last Name</label>
						<input type="text" name="last_name" required data-testid="patient-last-name" />
						<label>Date of Birth</label>
						<input type="date" name="date_of_birth" data-testid="patient-dob" />
						<label>Email</label>
						<input type="email" name="email" data-testid="patient-email" />
						<label>Phone</label>
						<input type="text" name="phone" data-testid="patient-phone" />
						<label>Address</label>
						<input type="text" name="address" data-testid="patient-address" />
						<label>Emergency Contact Name</label>
						<input type="text" name="emergency_contact_name" />
						<label>Emergency Contact Phone</label>
						<input type="text" name="emergency_contact_phone" />
						<label>Notes</label>
						<textarea name="notes" rows="3"></textarea>
						<ul class="actions special modal-actions">
							<li><button type="submit" class="button primary" data-testid="save-patient">Save</button></li>
							<li><button type="button" class="button" id="cancel-patient-btn">Cancel</button></li>
						</ul>
					</form>
				</div>
			</div>
		</div>

		<div id="doctor-form-overlay" class="modal-overlay" hidden aria-hidden="true" data-testid="doctor-form-overlay">
			<div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="doctor-form-title">
				<button type="button" class="modal-close" id="close-doctor-overlay" aria-label="Close" data-testid="close-doctor-overlay">&times;</button>
				<div class="modal-header">
					<h3 id="doctor-form-title">Add Doctor</h3>
				</div>
				<div class="modal-body">
					<form id="doctor-form" class="form-grid" data-testid="doctor-form">
						<label for="doctor-name">Name</label>
						<input type="text" id="doctor-name" name="name" required data-testid="doctor-name" />

						<label for="doctor-description">Description</label>
						<textarea id="doctor-description" name="description" rows="4" data-testid="doctor-description"></textarea>

						<label for="doctor-photo">Profile picture</label>
						<input type="file" id="doctor-photo" name="profile_picture" accept="image/jpeg,image/png,image/webp,image/gif" data-testid="doctor-photo" />
						<p class="field-hint">JPEG, PNG, WebP, or GIF · max 2 MB. Stored in Supabase Storage.</p>
						<div id="doctor-photo-preview" class="doctor-photo-preview" hidden>
							<img id="doctor-photo-preview-img" alt="Current profile picture" />
						</div>

						<ul class="actions special modal-actions">
							<li><button type="submit" class="button primary" data-testid="save-doctor">Save</button></li>
							<li><button type="button" class="button" id="cancel-doctor-btn">Cancel</button></li>
						</ul>
					</form>
				</div>
			</div>
		</div>

		<script src="../assets/js/jquery.min.js"></script>
		<script src="../assets/js/jquery.dropotron.min.js"></script>
		<script src="../assets/js/browser.min.js"></script>
		<script src="../assets/js/breakpoints.min.js"></script>
		<script src="../assets/js/util.js"></script>
		<script src="../assets/js/main.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
		<script src="../js/config.js"></script>
		<script src="../js/supabase-client.js"></script>
		<script src="../js/app.js"></script>
		<script src="../js/auth.js"></script>
		<script src="../js/patients.js"></script>
		<script src="../js/doctors.js"></script>
		<script src="../js/admin-dashboard.js"></script>
	</body>
</html>
